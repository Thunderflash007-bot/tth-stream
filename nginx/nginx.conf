worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ─── RTMP-Block ─────────────────────────────────────────────────────────────
rtmp {
    server {
        listen 4022;          # Kein Standard-Port 1935 – nur Port 4022
        chunk_size 4096;
        timeout 30s;

        application live {
            live on;
            record off;

            # Stream-Key-Sicherung: Nur dieser Key wird akzeptiert
            # Ändere "DEIN_GEHEIMER_KEY" auf einen sicheren Wert!
            on_publish http://127.0.0.1:4020/auth;
            on_publish_done http://127.0.0.1:4020/auth_done;

            # HLS-Umwandlung
            hls on;
            hls_path /var/www/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;

            # Segmentdateinamen nach Stream-Key benennen
            hls_fragment_naming system;
        }
    }
}

# ─── HTTP-Block ─────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # MIME-Typ für HLS
    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
    }

    # ── Auth-Endpoint (Stream-Key-Prüfung) ──────────────────────────────────
    # Dieser interne Server läuft auf 127.0.0.1:4020/auth
    # und wird nur intern von nginx angesprochen.
    server {
        listen 127.0.0.1:4020;

        location /auth {
            if ($arg_name != "74243974c3c38a6b0d75d7b3f43778c4") {
                return 403;
            }
            return 200;
        }

        location /auth_done {
            return 200;
        }
    }

    # ── Öffentlicher Web-Server auf Port 4020 ───────────────────────────────
    server {
        listen 4020;
        server_name _;

        root /var/www/html;
        index index.html;

        # HLS-Segmente ausliefern
        location /hls {
            alias /var/www/hls;

            # CORS für hls.js im Browser
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
        }

        # Statische Dateien (index.html etc.)
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
